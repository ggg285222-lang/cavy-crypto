name: Crypto Radar 24/7 Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: '是否发送一条测试消息到 Lark 验证连通性？'
        required: false
        default: 'false'
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行加密货币双策略扫描
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_alert }}" == "true" ]; then
            python scanner_cron.py --test-alert
          else
            python scanner_cron.py
          fi
